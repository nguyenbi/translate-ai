<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dịch Trực Tiếp</title>
  <meta name="theme-color" content="#0d0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img class="logo" src="icon-192.png" alt="">
        <div>
          <h1 data-i18n="title">Dịch Trực Tiếp</h1>
          <p id="status" class="status" role="status">Sẵn sàng</p>
        </div>
      </div>
      <div class="top-right">
        <div class="ui-lang" id="uiLang" role="group" data-i18n-aria="uiLang" aria-label="Ngôn ngữ giao diện">
          <button type="button" data-ui="vi">VI</button>
          <button type="button" data-ui="ja">日本</button>
        </div>
        <span class="live-pill"><i></i><span>LIVE</span></span>
      </div>
    </header>

    <section class="card langs">
      <label class="lang">
        <span class="lang-k" data-i18n="listenLabel">Nghe</span>
        <select id="src" aria-label="Ngôn ngữ nghe"></select>
      </label>
      <button id="swap" class="swap" data-i18n-aria="swap" aria-label="Đổi chiều dịch">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
      </button>
      <label class="lang">
        <span class="lang-k" data-i18n="toLabel">Dịch sang</span>
        <select id="dst" aria-label="Ngôn ngữ dịch"></select>
      </label>
    </section>

    <div class="seg" id="seg" role="group" data-i18n-aria="srcGroup" aria-label="Nguồn âm thanh">
      <button type="button" data-v="mic">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
        <span data-i18n="srcMic">Âm thanh xung quanh</span>
      </button>
      <button type="button" data-v="system">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-6v2h3v2H7v-2h3v-2H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm1 2v8h14V7H5Z"/></svg>
        <span data-i18n="srcSys">Âm thanh trong máy</span>
      </button>
    </div>
    <select id="input" hidden>
      <option value="mic">mic</option>
      <option value="system">system</option>
    </select>

    <section id="live" class="card live" aria-live="polite">
      <div class="live-head">
        <span class="badge" id="srcCode">JA</span>
        <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <p id="liveSrc" class="live-src"></p>
      <div class="divider"><span class="badge accent" id="dstCode">VI</span></div>
      <p id="liveDst" class="live-dst"></p>
    </section>

    <div class="hist-head">
      <h2><span data-i18n="history">Lịch sử</span> <span id="count" class="count"></span></h2>
      <div class="hist-actions">
        <details class="export" id="export">
          <summary class="ghost accent">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
            <span data-i18n="export">Xuất báo cáo</span>
          </summary>
          <div class="menu">
            <button type="button" data-fmt="html" data-i18n="expHtml">Báo cáo (HTML / in PDF)</button>
            <button type="button" data-fmt="csv" data-i18n="expCsv">Excel (CSV)</button>
            <button type="button" data-fmt="txt" data-i18n="expTxt">Văn bản (TXT)</button>
          </div>
        </details>
        <button id="clear" class="ghost" data-i18n="clear">Xoá tất cả</button>
      </div>
    </div>
    <ol id="history" class="history"></ol>

    <div class="credit">
      <img id="authorLogo" class="author-logo" alt="">
      <span id="credit"></span>
    </div>
  </div>

  <footer class="dock">
    <div class="dock-inner">
      <label class="chip">
        <input type="checkbox" id="tts">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3Zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4Zm-2.5-9v2.06a7 7 0 0 1 0 13.88V21a9 9 0 0 0 0-18Z"/></svg>
        <span data-i18n="tts">Đọc to</span>
      </label>
      <button id="mic" class="mic" data-i18n-aria="mic" aria-label="Bắt đầu / dừng nghe">
        <svg class="i-mic" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
        <svg class="i-stop" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
      </button>
      <span class="pair" id="pair">JA → VI</span>
    </div>
  </footer>

  <script src="logo.js"></script>
  <script src="app.js"></script>
</body>
</html>
